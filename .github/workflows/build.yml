# Rebuilds index.html automatically whenever content.json (or build.py / style.css) is edited on GitHub.
name: Rebuild site
on:
  workflow_dispatch:
  push:
    paths: ["content.json", "build.py", ".github/workflows/build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Rebuild index.html" && git push)
