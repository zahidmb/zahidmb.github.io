# Rebuilds the website when the CV export, the website-only settings, a CV PDF or the scripts change.
name: Rebuild site
on:
  workflow_dispatch:
  push:
    paths: ["cv.json", "cv.pdf", "site_extras.json", "content.json", "content.generated.json", "build.py", "from_rxresume.py", ".github/workflows/build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop if content.generated.json was edited by hand
        if: github.event_name == 'push'
        run: |
          if [ -f cv.json ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
             && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx content.generated.json; then
            echo "::error::content.generated.json is rebuilt from cv.json + site_extras.json on every run, so hand edits there are lost."
            echo "::error::Put website wording in site_extras.json (or text_replacements there), or change the CV and upload a new cv.json."
            git diff "${{ github.event.before }}" "${{ github.sha }}" -- content.generated.json
            exit 1
          fi
      - name: Read the CV export (only when cv.json exists)
        run: |
          if [ -f cv.json ]; then python3 from_rxresume.py; else echo "No cv.json: using content.json"; fi
      - run: python3 build.py
      - run: |
          git config user.name "site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild site" && git push)
